  function copyText(str, btn){
    var original = btn.textContent;
    function done(){ btn.textContent = "Copied! ✓ Paste into Claude"; setTimeout(function(){ btn.textContent = original; }, 2600); }
    function fallback(){
      var ta = document.createElement("textarea"); ta.value = str;
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand("copy"); done(); } catch(e){ toast("Couldn’t copy automatically — select and copy manually."); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(str).then(done, fallback);
    else fallback();
  }

  function saveToLog(kind, p, result){
    var tips = [];
    result.checks.forEach(function(c){ if(c.status !== "pass" && c.advice) tips.push({ cat:c.cat, text:c.advice }); });
    result.issues.forEach(function(is){ tips.push({ cat:is.cat, text:is.title + (is.fix ? " — " + is.fix : "") }); });
    if(!state.log) state.log = [];
    var sig = JSON.stringify(tips);
    var top = state.log[0];
    if(top && top.task === kind && top.title === p.title && JSON.stringify(top.tips) === sig){
      top.band = result.band; top.ts = new Date().toISOString(); save(); return; // avoid duplicate entries for the same text
    }
    state.log.unshift({ id:Date.now(), ts:new Date().toISOString(), task:kind, title:p.title, band:result.band, tips:tips });
    if(state.log.length > 120) state.log.length = 120;
    save();
  }

  function bindWriting(kind, p, minWords, minutes){
    var pad = document.getElementById("pad");
    var wc = document.getElementById("wc");
    var timerEl = document.getElementById("timer");
    var timerBtn = document.getElementById("timerBtn");
    var remaining = minutes*60, tick=null, running=false;

    pad.addEventListener("input", function(){
      var n = pad.value.trim() ? pad.value.trim().split(/\s+/).length : 0;
      wc.innerHTML = "Words: <b>"+n+"</b> / "+minWords;
      wc.classList.toggle("ok", n>=minWords);
    });

    function fmt(s){ return pad2(Math.floor(s/60))+":"+pad2(s%60); }
    timerBtn.addEventListener("click", function(){
      if(running){
        clearInterval(tick); running=false; timerBtn.textContent="▶ Resume"; timerEl.classList.remove("run");
      } else {
        running=true; timerBtn.textContent="⏸ Pause"; timerEl.classList.add("run");
        tick = setInterval(function(){
          remaining--; timerEl.textContent = fmt(Math.max(0,remaining));
          if(remaining<=0){ clearInterval(tick); running=false; timerEl.classList.remove("run"); timerEl.classList.add("over"); timerBtn.textContent="Time's up"; timerBtn.disabled=true; toast("⏱ Time's up! Review with the checklist."); }
        }, 1000);
      }
    });

    document.getElementById("nextPrompt").addEventListener("click", function(){
      generatePrompt(kind, kind==="t1" ? (state.t1Type || "mixed") : (state.t2Type || "mixed"));
    });
    main.querySelectorAll(".type-chip").forEach(function(c){
      c.addEventListener("click", function(){
        var tid = c.getAttribute("data-type");
        if(kind==="t1") state.t1Type = tid; else state.t2Type = tid;
        save();
        generatePrompt(kind, tid);
      });
    });

    var modelBtn = document.getElementById("modelBtn");
    var modelAns = document.getElementById("modelAns");
    if(modelBtn && modelAns){
      modelBtn.addEventListener("click", function(){
        var show = modelAns.classList.toggle("show");
        modelBtn.textContent = show ? "Hide model answer" : "Show model answer";
      });
    }

    // live auto-check as the user writes
    var debounce = null;
    pad.addEventListener("input", function(){
      clearTimeout(debounce);
      debounce = setTimeout(function(){
        var n = pad.value.trim() ? pad.value.trim().split(/\s+/).filter(Boolean).length : 0;
        if(n >= 20) applyAnalysis(analyzeWriting(kind, p, pad.value));
      }, 850);
    });

    function evaluateAndSave(showReport){
      var n = pad.value.trim() ? pad.value.trim().split(/\s+/).length : 0;
      if(n < 25) return null;
      var result = analyzeWriting(kind, p, pad.value);
      applyAnalysis(result);
      if(showReport) renderReport(result, kind, p);
      saveToLog(kind, p, result);
      var ab = document.getElementById("aiBtn"); if(ab) ab.hidden = false;
      var ae = document.getElementById("aiEvalBtn"); if(ae) ae.hidden = false;
      return result;
    }

    // auto-save errors when you finish writing (leave the text box)
    pad.addEventListener("blur", function(){ evaluateAndSave(false); });

    // full evaluation + report on demand
    document.getElementById("evalBtn").addEventListener("click", function(){
      var n = pad.value.trim() ? pad.value.trim().split(/\s+/).length : 0;
      if(n < 25){ toast("Write a bit more first ✍️"); return; }
      evaluateAndSave(true);
      if(!state.evaluated) state.evaluated = {};
      if(!state.evaluated[p.id]){
        state.evaluated[p.id] = true;
        state.written[kind] = (state.written[kind]||0) + 1;
        save(); addXP(15);
      } else {
        save(); toast("Evaluated ✓ — errors saved to your log");
      }
      var rep = document.getElementById("report");
      if(rep) rep.scrollIntoView({ behavior:"smooth", block:"nearest" });
    });

    // copy a ready-made prompt for a real Band 8 correction in Claude
    document.getElementById("aiBtn").addEventListener("click", function(){
      copyText(buildAIPrompt(kind, p, pad.value), this);
    });
    // send to the AI examiner (online, Sonnet 5)
    document.getElementById("aiEvalBtn").addEventListener("click", function(){
      aiEvaluate(kind, p, pad.value, this);
    });
  }

  /* ---------- Quiz engine (register / essaytype / cohesion / collocation) ---------- */
  function quizView(id){
    var conf = GAMES[id];
    var bank = conf.bank.slice();
    shuffle(bank);
    var picked = bank.slice(0, Math.min(8, bank.length));
    // shuffle options within each question so the answer is never in a fixed slot
    var qs = picked.map(function(q){
      var pairs = q.opts.map(function(o, idx){ return { o:o, isCorrect: idx===q.correct }; });
      shuffle(pairs);
      var ci = 0;
      for(var z=0; z<pairs.length; z++){ if(pairs[z].isCorrect) ci = z; }
      return { stem:q.stem, quote:q.quote, opts: pairs.map(function(pp){ return pp.o; }), correct:ci, exp:q.exp };
    });
    var i = 0, correct = 0, answered = false;

    function render(){
      if(i >= qs.length){ return renderResult(); }
      var q = qs[i];
      var stem = q.stem + (q.quote ? '<span class="quote">“'+q.quote+'”</span>' : '');
      main.innerHTML =
        topbar(conf.title, conf.sub)
        + '<div class="quiz-wrap fade-in">'
          + '<div class="quiz-top">'
            + '<div class="q-progress"><i style="width:'+(i/qs.length*100)+'%"></i></div>'
            + '<div class="q-count">'+(i+1)+' / '+qs.length+' · <b style="color:var(--good)">'+correct+' ✓</b></div>'
          + '</div>'
          + '<div class="card q-card">'
            + '<div class="q-tag">'+conf.title+'</div>'
            + '<p class="q-stem">'+stem+'</p>'
            + '<div class="opts" id="opts">'
              + q.opts.map(function(o,k){
                  return '<button class="opt" data-k="'+k+'"><span class="kbd">'+String.fromCharCode(65+k)+'</span><span>'+o+'</span></button>';
                }).join('')
            + '</div>'
            + '<div class="explain" id="explain"></div>'
            + '<div class="quiz-foot"><div class="verdict" id="verdict"></div><button class="btn primary hidden" id="nextQ">Next ▶</button></div>'
          + '</div>'
        + '</div>';
      refreshChips();

      answered = false;
      var opts = main.querySelectorAll(".opt");
      opts.forEach(function(btn){
        btn.addEventListener("click", function(){ pick(+btn.getAttribute("data-k"), q, opts); });
      });
      document.getElementById("nextQ").addEventListener("click", function(){ i++; render(); });
    }

    function pick(k, q, opts){
      if(answered) return;
      answered = true;
      var ok = k === q.correct;
      if(ok) correct++;
      opts.forEach(function(b){
        var bk = +b.getAttribute("data-k");
        b.disabled = true;
        if(bk === q.correct) b.classList.add("correct");
        else if(bk === k) b.classList.add("wrong");
      });
      var vd = document.getElementById("verdict");
      vd.className = "verdict " + (ok?"ok":"no");
      vd.innerHTML = ok ? "✓ Correct!" : "✕ Not quite — see the explanation";
      var ex = document.getElementById("explain");
      ex.innerHTML = q.exp;
      ex.classList.add("show");
      document.getElementById("nextQ").classList.remove("hidden");
      if(ok) toast("Nice!", 2);
    }

    function renderResult(){
      var pct = Math.round(correct/qs.length*100);
      var stars = pct>=90?5 : pct>=75?4 : pct>=50?3 : pct>=30?2 : 1;
      var earned = correct * conf.xp;
      // record best
      var rec = state.games[id] || { best:0, plays:0 };
      rec.plays++; rec.best = Math.max(rec.best||0, stars);
      state.games[id] = rec;
      save();
      addXP(earned);

      var circ = 2*Math.PI*54;
      main.innerHTML =
        topbar(conf.title, conf.sub)
        + '<div class="quiz-wrap fade-in"><div class="card result">'
          + '<div class="score-ring">'
            + '<svg width="128" height="128" viewBox="0 0 128 128">'
              + '<circle cx="64" cy="64" r="54" fill="none" stroke="var(--line)" stroke-width="11"/>'
              + '<circle cx="64" cy="64" r="54" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-pct/100))+'" transform="rotate(-90 64 64)"/>'
            + '</svg>'
            + '<b>'+pct+'%</b>'
          + '</div>'
          + '<h3>'+correct+' of '+qs.length+' correct</h3>'
          + '<p>'+"★".repeat(stars)+"☆".repeat(5-stars)+' · +'+earned+' XP earned</p>'
          + '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'
            + '<button class="btn primary" id="again">Play again</button>'
            + '<button class="btn" id="toHome">Back to dashboard</button>'
          + '</div>'
        + '</div></div>';
      refreshChips();
      document.getElementById("again").addEventListener("click", function(){ quizView(id); });
      document.getElementById("toHome").addEventListener("click", function(){ go("home"); });
    }

    render();
  }

          '<div class="phrase-grid">'
          + phrase("Formal (no name)","<code>Dear Sir or Madam,</code> … <code>Yours faithfully,</code>")
          + phrase("Formal (with name)","<code>Dear Mr Lee,</code> … <code>Yours sincerely,</code>")
          + phrase("Informal","<code>Hi Sam,</code> … <code>Take care, / Speak soon,</code>")
          + phrase("Formal purpose","<code>I am writing to enquire about…</code>")
          + phrase("Complaint","<code>I am writing to express my dissatisfaction with…</code>")
          + phrase("Polite request","<code>I would be grateful if you could…</code>")
          + phrase("Informal purpose","<code>I just wanted to let you know…</code>")
          + phrase("Formal closing","<code>I look forward to your prompt reply.</code>")
          + '</div>')
      + acc("Task 2 — the 5 question types",
          '<p><strong>Opinion (Agree/Disagree):</strong> clear stance from the intro; defend it throughout.</p>'
        + '<p><strong>Discussion (both views + opinion):</strong> one paragraph per view + your opinion.</p>'
        + '<p><strong>Advantages &amp; Disadvantages:</strong> weigh both sides; if it asks "outweigh", decide which is stronger.</p>'
        + '<p><strong>Problem &amp; Solution (Causes/Solutions):</strong> a causes paragraph + a concrete solutions paragraph.</p>'
        + '<p><strong>Two-part Question:</strong> answer <strong>both</strong> questions explicitly.</p>')
      + acc("Connectors by function (natural cohesion)",
          '<div class="phrase-grid">'
          + phrase("Add","<code>Moreover · Furthermore · In addition · What is more</code>")
          + phrase("Contrast","<code>However · On the other hand · Nevertheless · Nonetheless</code>")
          + phrase("Concession","<code>Although · Despite / In spite of + noun</code>")
          + phrase("Cause/Effect","<code>As a result · Consequently · Therefore · owing to</code>")
          + phrase("Exemplify","<code>For instance · A prime example is</code>")
          + phrase("Conclude","<code>In conclusion · To sum up · On balance</code>")
          + '</div>')
      + acc("High-value template phrases (T2)",
          '<div class="phrase-grid">'
          + phrase("Intro (paraphrase)","<code>It is often argued that…</code>")
          + phrase("Thesis","<code>This essay will argue that…</code>")
          + phrase("Opinion","<code>I am firmly of the view that…</code>")
          + phrase("Concession","<code>While it is true that…, …</code>")
          + phrase("Example","<code>A case in point is…</code>")
          + phrase("Balance","<code>On balance, the benefits outweigh…</code>")
          + '</div>')
      + acc("Mistakes that keep you stuck at Band 6.5",
          '<p>• Memorising phrases and forcing them in (examiners spot it).</p>'
        + '<p>• Not answering <strong>every</strong> part of the question.</p>'
        + '<p>• Mixing formal and informal register in Task 1.</p>'
        + '<p>• Overloading linking words ("Firstly… Secondly… Moreover… Furthermore…" in every sentence).</p>'
        + '<p>• Long, complex sentences <em>with errors</em>: 3 correct sentences beat one brilliant broken one.</p>'
        + '<p>• Not leaving 3-4 minutes to check spelling, articles and agreement.</p>')
      + '</div>';
    refreshChips();
  };
  function acc(title, body){
    return '<details class="acc"><summary>'+title+'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></summary><div class="acc-body">'+body+'</div></details>';
  }
  function phrase(k, v){ return '<div class="phrase"><div style="font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:4px">'+k+'</div>'+v+'</div>'; }

  /* ---------- Mistakes & Tips log ---------- */
  views.log = function(){
    var log = state.log || [];
    var html = topbar("Mistakes & Tips", "Every tip you’ve been given — saved so you can track and beat your recurring mistakes.");
    if(!log.length){
      html += '<div class="card empty"><div class="big">📓</div>'
        + '<b style="color:var(--ink);font-size:16px">No tips saved yet</b>'
        + '<p style="margin-top:6px">Write a letter or essay and press <b>“Finish &amp; evaluate”</b>. Every piece of advice will be collected here so you can see what to improve.</p></div>';
      main.innerHTML = html; refreshChips(); return;
    }
    var freq = {};
    log.forEach(function(e){ e.tips.forEach(function(t){ freq[t.cat] = (freq[t.cat]||0)+1; }); });
    var freqArr = Object.keys(freq).map(function(k){ return [k, freq[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    var totalTips = freqArr.reduce(function(s,x){ return s+x[1]; }, 0);

    html += '<div class="card" style="padding:16px 18px;margin-bottom:18px">'
      + '<div style="font-family:var(--serif);font-size:15px;margin-bottom:4px">Your most frequent weak spots</div>'
      + '<p style="font-size:12.5px;color:var(--ink-faint);margin:0 0 12px">'+totalTips+' tips across '+log.length+' evaluation'+(log.length>1?"s":"")+'. Attack the ones with the highest counts first.</p>'
      + '<div class="log-freq">' + freqArr.map(function(x){ return '<span class="freq-chip">'+esc(x[0])+' <b>'+x[1]+'</b></span>'; }).join("") + '</div></div>';

    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      + '<div class="section-title" style="margin:0;flex:1">History <span class="rule"></span></div>'
      + '<button class="btn ghost" id="clearLog">Clear log</button></div>';

    html += log.map(function(e){
      var d = new Date(e.ts);
      var date = d.toLocaleDateString(undefined,{ day:"2-digit", month:"short" }) + " · " + d.toLocaleTimeString(undefined,{ hour:"2-digit", minute:"2-digit" });
      var pillCls = e.task === "t1" ? "t1" : "t2";
      return '<div class="card log-entry"><div class="le-head">'
        + '<span class="pill '+pillCls+'">'+(e.task === "t1" ? "Task 1" : "Task 2")+'</span>'
        + '<b style="font-family:var(--serif);font-size:14px">'+esc(e.title)+'</b>'
        + '<span class="pill" style="background:var(--accent-soft);color:var(--accent-ink)">Band ~'+e.band.toFixed(1)+'</span>'
        + '<span class="le-date" style="margin-left:auto">'+date+'</span></div>'
        + (e.tips.length
            ? '<ul>' + e.tips.map(function(t){ return '<li><b style="color:var(--ink-soft)">'+esc(t.cat)+':</b> '+esc(t.text)+'</li>'; }).join("") + '</ul>'
            : '<p style="font-size:13px;color:var(--good);margin:0">No issues — clean pass! ✓</p>')
        + '</div>';
    }).join("");

    main.innerHTML = html; refreshChips();
    var cl = document.getElementById("clearLog");
    if(cl) cl.addEventListener("click", function(){
      if(window.confirm("Clear all saved tips? This cannot be undone.")){ state.log = []; save(); go("log"); }
    });
  };

  /* ---------- Saved submissions (text + highlighted errors + Band 8 rewrite) ---------- */
  views.submissions = function(){
    var subs = state.submissions || [];
    var html = topbar("My Submissions", "Your writing, saved with errors highlighted and the Band 8 rewrite side by side.");
    if(!subs.length){
      html += '<div class="card empty"><div class="big">\uD83D\uDCC4</div>'
        + '<b style="color:var(--ink);font-size:16px">No saved writing yet</b>'
        + '<p style="margin-top:6px">Write a Task 1 or Task 2 answer and press <b>\uD83E\uDD16 Correct with AI</b>. Your text (with mistakes highlighted) and the Band 8 rewrite are saved here automatically.</p></div>';
      main.innerHTML = html; refreshChips(); return;
    }
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      + '<div class="section-title" style="margin:0;flex:1">Saved writing <span class="rule"></span></div>'
      + '<button class="btn ghost" id="clearSubs">Clear all</button></div>';
    html += subs.map(function(e){
      var d = new Date(e.ts);
      var date = d.toLocaleDateString(undefined,{ day:"2-digit", month:"short" }) + " \u00B7 " + d.toLocaleTimeString(undefined,{ hour:"2-digit", minute:"2-digit" });
      var pillCls = e.task === "t1" ? "t1" : "t2";
      var overall = (e.bands && e.bands.overall != null) ? Number(e.bands.overall).toFixed(1) : "\u2013";
      return '<div class="card sub-card"><div class="sc-head">'
        + '<span class="pill ' + pillCls + '">' + (e.task === "t1" ? "Task 1" : "Task 2") + '</span>'
        + '<b style="font-family:var(--serif);font-size:14px">' + esc(e.title) + '</b>'
        + '<span class="pill" style="background:var(--accent-soft);color:var(--accent-ink)">Band ~' + overall + '</span>'
        + '<span class="sc-date">' + date + '</span></div>'
        + '<div class="sub-cols">'
          + '<div class="sub-block"><h6>Your writing \u2014 hover a highlight for the fix</h6><div class="sub-text">' + highlightErrors(e.original, e.mistakes) + '</div></div>'
          + '<div class="sub-block"><h6>Band 8+ rewrite</h6><div class="sub-text model">' + esc(e.rewrite || "").replace(/\n/g, "<br>") + '</div></div>'
        + '</div></div>';
    }).join("");
    main.innerHTML = html; refreshChips();
    var cs = document.getElementById("clearSubs");
    if(cs) cs.addEventListener("click", function(){
      if(window.confirm("Delete all saved submissions? This cannot be undone.")){ state.submissions = []; save(); go("submissions"); }
    });
  };

  /* ---------- Study & Drills (custom + saved mini-lessons) ---------- */
  function buildCustomLesson(topic){
    var out = document.getElementById("customLessonOut");
    var btn = document.getElementById("buildLesson");
    if(btn){ btn.disabled = true; btn.textContent = "\u23F3 Building\u2026"; }
    if(out){ out.hidden = false; out.innerHTML = '<div style="padding:14px;color:var(--ink-faint);font-size:13px">\u23F3 Building your class\u2026 (~10s)</div>'; }
    fetch("/api/lesson", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-app-password": getPassword() },
      body: JSON.stringify({ topic: topic, task: "" })
    }).then(function(r){
      if(r.status === 401){ state.aiPassword = ""; save(); throw new Error("Wrong password \u2014 reload and try again."); }
      if(!r.ok) return r.text().then(function(t){ throw new Error("Server error (" + r.status + ")."); });
      return r.json();
    }).then(function(data){
      if(data && data.error) throw new Error(data.error);
      saveLesson("topic", topic, data);
      addXP(8);
      go("lessons");
    }).catch(function(err){
      if(out) out.innerHTML = '<div style="padding:12px;color:var(--bad);font-size:13px">\u26A0\uFE0F ' + esc(err.message || "Could not build the lesson.") + '</div>';
      if(btn){ btn.disabled = false; btn.textContent = "\uD83D\uDCD6 Build lesson"; }
    });
  }

  views.lessons = function(){
    var ls = state.lessons || [];
    var html = topbar("Study & Drills", "Ask for any topic and get a full class \u2014 when & how to use it, examples, and exercises. Everything you generate is saved here.");
    html += '<div class="card" style="padding:16px 18px;margin-bottom:18px">'
      + '<div style="font-family:var(--serif);font-size:15px;margin-bottom:8px">Build a lesson on any topic</div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
        + '<input id="lessonTopic" placeholder="e.g. how to use \u201Chowever\u201D, the past perfect, formal complaint phrases\u2026" style="flex:1;min-width:220px;padding:10px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px" />'
        + '<button class="btn primary" id="buildLesson">\uD83D\uDCD6 Build lesson</button>'
      + '</div>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px" id="topicSuggest"></div>'
      + '<div id="customLessonOut" hidden></div></div>';
    if(ls.length){
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
        + '<div class="section-title" style="margin:0;flex:1">Saved lessons <span class="rule"></span></div>'
        + '<button class="btn ghost" id="clearLessons">Clear all</button></div>';
      html += ls.map(function(e){
        var d = new Date(e.ts);
        var date = d.toLocaleDateString(undefined,{ day:"2-digit", month:"short" });
        var pill = e.task === "t1" ? "t1" : "t2";
        var lbl = e.task === "t1" ? "Task 1" : e.task === "t2" ? "Task 2" : "Topic";
        return '<div class="card" style="padding:16px 18px;margin-bottom:12px">'
          + '<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap">'
            + '<span class="pill ' + pill + '">' + lbl + '</span>'
            + '<b style="font-family:var(--serif);font-size:13.5px">' + esc(e.topic || "") + '</b>'
            + '<span style="font-size:12px;color:var(--ink-faint);font-family:var(--mono);margin-left:auto">' + date + '</span></div>'
          + renderLesson(e.lesson) + '</div>';
      }).join("");
    } else {
      html += '<div class="card empty" style="padding:34px 24px"><div class="big">\uD83D\uDCD6</div>'
        + '<b style="color:var(--ink);font-size:15px">No saved lessons yet</b>'
        + '<p style="margin-top:6px">Type a topic above and press <b>Build lesson</b> \u2014 or press <b>\uD83D\uDCD6 Learn</b> on any tip in an AI correction\u2019s <b>Practise next</b> list.</p></div>';
    }
    main.innerHTML = html; refreshChips();
    wireLessonReveals(main);
    var sug = document.getElementById("topicSuggest");
    if(sug){
      ["Linking words for contrast","Past perfect tense","Formal complaint phrases","Paraphrasing techniques","Articles (a / an / the)","Conditionals (if-clauses)"].forEach(function(t){
        var b = document.createElement("button");
        b.className = "type-chip"; b.textContent = t;
        b.addEventListener("click", function(){ var inp = document.getElementById("lessonTopic"); if(inp) inp.value = t; buildCustomLesson(t); });
        sug.appendChild(b);
      });
    }
    var bl = document.getElementById("buildLesson");
    if(bl) bl.addEventListener("click", function(){
      var inp = document.getElementById("lessonTopic");
      var topic = inp ? inp.value.trim() : "";
      if(topic.length < 3){ toast("Type a topic first \u270D\uFE0F"); return; }
      buildCustomLesson(topic);
    });
    var lt = document.getElementById("lessonTopic");
    if(lt) lt.addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ ev.preventDefault(); var b = document.getElementById("buildLesson"); if(b) b.click(); } });
    var cl = document.getElementById("clearLessons");
    if(cl) cl.addEventListener("click", function(){
      if(window.confirm("Delete all saved lessons? This cannot be undone.")){ state.lessons = []; save(); go("lessons"); }
    });
  };

  /* wire view dispatch */
  views.task1 = function(){ writingView("t1"); };
  views.task2 = function(){ writingView("t2"); };
  views.register = function(){ quizView("register"); };
  views.essaytype = function(){ quizView("essaytype"); };
  views.cohesion = function(){ quizView("cohesion"); };
  views.collocation = function(){ quizView("collocation"); };
  views.paraphrase = paraphraseView;

  /* ============================ NAV ============================ */
  var NAV = [
    ["home","Dashboard"],["task1","Task 1"],["task2","Task 2"],
    ["register","Register"],["essaytype","Essay"],["cohesion","Cohesion"],
    ["collocation","Collocations"],["paraphrase","Paraphrase"],["reference","Guide"],["log","Tips"],["submissions","Writing"],["lessons","Drills"]
  ];
  function buildMobileTabs(){
    var m = document.getElementById("mtabs");
    m.innerHTML = NAV.map(function(n){ return '<button class="mtab" data-view="'+n[0]+'">'+n[1]+'</button>'; }).join('');
    m.querySelectorAll(".mtab").forEach(function(b){ b.addEventListener("click", function(){ go(b.getAttribute("data-view")); }); });
  }
  function setActive(view){
    document.querySelectorAll(".nav-btn").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-view")===view); });
    document.querySelectorAll(".mtab").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-view")===view); });
  }
  function go(view){
    if(!views[view]) view = "home";
    setActive(view);
    window.scrollTo(0,0);
    views[view]();
  }
  function bindGo(){
    main.querySelectorAll("[data-go]").forEach(function(el){
      el.addEventListener("click", function(){ go(el.getAttribute("data-go")); });
    });
  }
  document.querySelectorAll(".nav-btn").forEach(function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-view")); });
  });

  /* ============================ THEME ============================ */
  function applyTheme(t){
    if(t){ document.documentElement.setAttribute("data-theme", t); }
    else { document.documentElement.removeAttribute("data-theme"); }
    state.theme = t; save();
  }
  function currentTheme(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.getElementById("themeBtn").addEventListener("click", function(){
    applyTheme(currentTheme()==="dark" ? "light" : "dark");
  });
  if(state.theme) applyTheme(state.theme);

  /* ============================ UTIL ============================ */
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ============================ BOOT ============================ */
  buildMobileTabs();
  go("home");
})();
</script>
